<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe - Functional Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="range"] { accent-color: #A855F7; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "w-6 h-6" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- SHARED COMPONENTS ---
        const BottomNav = ({ activeTab, setView }) => (
            <nav className="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-slate-100 flex justify-around py-4 px-2 z-50">
                <NavItem onClick={() => setView('explore')} icon="compass" label="Explore" active={activeTab === 'explore'} />
                <NavItem onClick={() => setView('community')} icon="users" label="Community" active={activeTab === 'community'} />
                <NavItem onClick={() => setView('messages')} icon="message-circle" label="Messages" active={activeTab === 'messages'} />
                <NavItem onClick={() => setView('invitations')} icon="mail" label="Invites" active={activeTab === 'invitations'} badge="1" />
                <NavItem onClick={() => setView('profile')} icon="user" label="Profile" active={activeTab === 'profile'} />
            </nav>
        );

        const NavItem = ({ onClick, icon, label, active, badge }) => (
            <div onClick={onClick} className={`flex flex-col items-center cursor-pointer relative ${active ? 'text-[#8B5CF6]' : 'text-slate-300'}`}>
                <Icon name={icon} />
                <span className="text-[10px] font-bold mt-1">{label}</span>
                {badge && <span className="absolute -top-1 -right-1 bg-purple-500 text-white text-[8px] font-bold px-1 rounded-full">{badge}</span>}
            </div>
        );

        // --- VIEW: CREATE ACTIVITY ---
        const CreateActivityView = ({ onSave, onCancel }) => {
            const [form, setForm] = useState({ title: '', desc: '', category: 'Handicraft & DIY', location: '', date: '', price: '', maxPeople: '', image: 'https://images.unsplash.com/photo-1513364235739-ec90ef769747?auto=format&fit=crop&w=800' });
            
            return (
                <div className="min-h-screen bg-white pb-10">
                    <header className="p-6 flex items-center gap-4 border-b">
                        <div onClick={onCancel} className="cursor-pointer"><Icon name="x" /></div>
                        <h1 className="text-xl font-bold">New Activity</h1>
                    </header>
                    <div className="p-6 space-y-4">
                        <div className="h-40 bg-slate-100 rounded-3xl overflow-hidden mb-2 relative">
                            <img src={form.image} className="w-full h-full object-cover opacity-50" />
                            <div className="absolute inset-0 flex items-center justify-center text-slate-500 font-bold">Tap to upload picture</div>
                        </div>
                        <input placeholder="Title" className="w-full p-4 bg-slate-50 rounded-2xl border-none" onChange={e => setForm({...form, title: e.target.value})} />
                        <textarea placeholder="Description" className="w-full p-4 bg-slate-50 rounded-2xl border-none h-24" onChange={e => setForm({...form, desc: e.target.value})} />
                        <select className="w-full p-4 bg-slate-50 rounded-2xl border-none" onChange={e => setForm({...form, category: e.target.value})}>
                            <option>Handicraft & DIY</option>
                            <option>Fitness & Sport</option>
                            <option>Art & Culture</option>
                            <option>Nightlife & Bars</option>
                        </select>
                        <input placeholder="Location" className="w-full p-4 bg-slate-50 rounded-2xl border-none" onChange={e => setForm({...form, location: e.target.value})} />
                        <div className="flex gap-2">
                            <input type="datetime-local" className="flex-1 p-4 bg-slate-50 rounded-2xl border-none text-sm" onChange={e => setForm({...form, date: e.target.value})} />
                            <input placeholder="Price (DKK)" className="w-24 p-4 bg-slate-50 rounded-2xl border-none" onChange={e => setForm({...form, price: e.target.value})} />
                        </div>
                        <input type="number" placeholder="Max participants" className="w-full p-4 bg-slate-50 rounded-2xl border-none" onChange={e => setForm({...form, maxPeople: e.target.value})} />
                        <button onClick={() => onSave(form)} className="w-full bg-gradient-to-r from-[#A855F7] to-[#F97316] text-white py-4 rounded-2xl font-bold mt-4 shadow-lg">Publish Activity</button>
                    </div>
                </div>
            );
        };

        // --- VIEW: CHAT INTERFACE ---
        const ChatView = ({ contact, onBack }) => {
            const [msg, setMsg] = useState('');
            const [history, setHistory] = useState([{ text: "Hey! Are you going to the event?", me: false }]);
            
            const send = () => {
                if(!msg) return;
                setHistory([...history, { text: msg, me: true }]);
                setMsg('');
            };

            return (
                <div className="flex flex-col h-screen bg-white">
                    <header className="p-4 border-b flex items-center gap-4">
                        <div onClick={onBack} className="cursor-pointer"><Icon name="arrow-left" /></div>
                        <div className="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center font-bold text-purple-600">{contact[0]}</div>
                        <span className="font-bold">{contact}</span>
                    </header>
                    <div className="flex-1 p-4 overflow-y-auto space-y-4">
                        {history.map((m, i) => (
                            <div key={i} className={`flex ${m.me ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[80%] p-4 rounded-2xl text-sm font-medium ${m.me ? 'bg-purple-600 text-white rounded-tr-none' : 'bg-slate-100 text-slate-800 rounded-tl-none'}`}>
                                    {m.text}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="p-4 border-t flex gap-2">
                        <input value={msg} onChange={e => setMsg(e.target.value)} placeholder="Type a message..." className="flex-1 bg-slate-100 rounded-full px-5 py-3 outline-none" onKeyPress={e => e.key === 'Enter' && send()} />
                        <button onClick={send} className="bg-purple-600 text-white p-3 rounded-full"><Icon name="send" className="w-5 h-5" /></button>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        function App() {
            const [view, setView] = useState('onboarding');
            const [activities, setActivities] = useState([
                { id: 1, title: 'Planet Workshop', category: 'Handicraft & DIY', image: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&q=80&w=800', location: 'Farum', price: '0', date: '2026-01-15' }
            ]);
            const [moments, setMoments] = useState([
                { id: 1, user: 'test', location: 'Copenhagen', img: 'https://images.unsplash.com/photo-1542601906990-b4d3fb773b09?auto=format&fit=crop&w=800', caption: 'ACT NOW' }
            ]);
            const [chatTarget, setChatTarget] = useState(null);

            if (chatTarget) return <ChatView contact={chatTarget} onBack={() => setChatTarget(null)} />;
            if (view === 'create-activity') return <CreateActivityView onCancel={() => setView('explore')} onSave={(act) => { setActivities([act, ...activities]); setView('explore'); }} />;

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl overflow-x-hidden">
                    {view === 'onboarding' && (
                        <div className="h-screen bg-gradient-to-br from-[#A855F7] to-[#F97316] flex flex-col items-center justify-center p-8 text-white text-center">
                            <h1 className="text-5xl font-black mb-6 leading-tight">Your Budget.<br/>Your Vibe.</h1>
                            <button onClick={() => setView('explore')} className="bg-white text-purple-600 px-12 py-4 rounded-2xl font-bold text-xl shadow-xl hover:scale-105 transition-transform">Get Started</button>
                        </div>
                    )}

                    {view === 'explore' && (
                        <div className="pb-24">
                            <header className="p-6 flex justify-between items-center">
                                <h1 className="text-3xl font-bold">Explore</h1>
                                <button onClick={() => setView('create-activity')} className="bg-[#A855F7] text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-orange-500 transition-all">+ Create</button>
                            </header>
                            <div className="px-6 space-y-6">
                                {activities.map(act => (
                                    <div key={act.id} className="h-72 bg-slate-100 rounded-[32px] relative overflow-hidden shadow-lg">
                                        <img src={act.image} className="w-full h-full object-cover" />
                                        <div className="absolute top-4 left-4 bg-[#8B5CF6] text-white px-3 py-1 rounded-full text-[10px] font-bold uppercase">{act.category}</div>
                                        <div className="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/80 to-transparent text-white">
                                            <h3 className="text-xl font-bold">{act.title}</h3>
                                            <p className="text-xs opacity-80">{act.location} • {act.price} DKK</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'community' && (
                        <div className="pb-24">
                            <header className="p-6 flex justify-between items-center border-b">
                                <h1 className="text-2xl font-bold">Community</h1>
                                <button onClick={() => {
                                    const cap = prompt("Share a moment caption:");
                                    if(cap) setMoments([{ id: Date.now(), user: 'me', location: 'Current Location', img: 'https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=800', caption: cap }, ...moments]);
                                }} className="bg-orange-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md">Share Moment</button>
                            </header>
                            <div className="p-6 space-y-8">
                                {moments.map(m => (
                                    <div key={m.id} className="bg-white border rounded-[32px] p-4 shadow-sm space-y-4">
                                        <div className="flex items-center gap-3">
                                            <div onClick={() => setChatTarget(m.user)} className="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center font-bold text-purple-500 cursor-pointer">{m.user[0].toUpperCase()}</div>
                                            <div><p className="font-bold text-sm">{m.user}</p><p className="text-[10px] text-slate-400">{m.location}</p></div>
                                        </div>
                                        <div className="h-64 rounded-2xl overflow-hidden"><img src={m.img} className="w-full h-full object-cover" /></div>
                                        <p className="text-sm font-medium px-1 italic">"{m.caption}"</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'messages' && (
                        <div className="pb-24">
                            <header className="p-6 border-b"><h1 className="text-2xl font-bold">Messages</h1></header>
                            <div className="divide-y">
                                {['Sarah', 'Mads', 'Emma'].map(name => (
                                    <div key={name} onClick={() => setChatTarget(name)} className="p-6 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                                        <div className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-400">{name[0]}</div>
                                        <div className="flex-1">
                                            <div className="flex justify-between"><h3 className="font-bold">{name}</h3><span className="text-[10px] text-slate-300">10:30 AM</span></div>
                                            <p className="text-xs text-slate-400 truncate">Hey! Are you going to the event?</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view !== 'onboarding' && <BottomNav activeTab={view} setView={setView} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
