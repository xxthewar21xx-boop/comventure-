<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel (to run React in browser) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icon Component (Helper for CDN version) ---
        const Icon = ({ name, className = "w-6 h-6", color = "currentColor" }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} className={className} style={{ color }}></i>;
        };

        // --- SHARED COMPONENTS ---
        const BottomNav = ({ activeTab, setView }) => (
            <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around py-4 px-2 z-50">
                <NavItem onClick={() => setView('explore')} icon="compass" label="Explore" active={activeTab === 'explore'} />
                <NavItem onClick={() => setView('community')} icon="users" label="Community" active={activeTab === 'community'} />
                <NavItem onClick={() => setView('messages')} icon="message-circle" label="Messages" active={activeTab === 'messages'} />
                <div onClick={() => setView('invitations')} className={`flex flex-col items-center cursor-pointer relative ${activeTab === 'invitations' ? 'text-[#8B5CF6]' : 'text-slate-300'}`}>
                    <Icon name="mail" />
                    <span className="text-[10px] font-bold mt-1">Invitations</span>
                    <span className="absolute -top-1 right-2 bg-purple-100 text-purple-600 text-[10px] font-bold px-1.5 rounded-full">1</span>
                </div>
                <NavItem onClick={() => setView('profile')} icon="user" label="Profile" active={activeTab === 'profile'} />
            </nav>
        );

        const NavItem = ({ onClick, icon, label, active }) => (
            <div onClick={onClick} className={`flex flex-col items-center cursor-pointer transition-colors ${active ? 'text-[#8B5CF6]' : 'text-slate-300 hover:text-purple-400'}`}>
                <Icon name={icon} />
                <span className="text-[10px] font-bold mt-1">{label}</span>
            </div>
        );

        // --- SCREENS ---
        const Onboarding = ({ onComplete }) => (
            <div className="h-screen bg-gradient-to-br from-[#A855F7] to-[#F97316] flex flex-col items-center justify-center p-8 text-white text-center">
                <h1 className="text-5xl font-black mb-6 leading-tight">Your Budget.<br/>Your Interests.</h1>
                <p className="mb-10 opacity-90">Discover affordable experiences nearby.</p>
                <button onClick={onComplete} className="bg-white text-purple-600 px-12 py-4 rounded-2xl font-bold text-xl shadow-xl hover:scale-105 transition-transform">
                    Get Started
                </button>
            </div>
        );

        const Explore = ({ setView }) => (
            <div className="pb-24">
                <header className="p-6 flex justify-between items-center">
                    <h1 className="text-3xl font-bold">Explore</h1>
                    <div className="bg-[#A855F7] text-white px-4 py-2 rounded-xl text-sm font-bold cursor-pointer hover:bg-orange-500 transition-colors">+ Create</div>
                </header>
                <div className="px-6 mb-6">
                    <div className="relative">
                        <div className="absolute left-4 top-3 text-slate-400"><Icon name="search" className="w-5 h-5" /></div>
                        <input className="w-full bg-white border border-slate-100 shadow-sm rounded-2xl py-3 pl-12" placeholder="Search activities..." />
                    </div>
                </div>
                <main className="px-6">
                    <h2 className="text-xl font-bold mb-4">Activities nearby</h2>
                    <div className="h-64 bg-slate-200 rounded-[32px] mb-4 relative overflow-hidden shadow-lg group">
                        <img src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&q=80&w=1000" className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                        <div className="absolute top-4 left-4 bg-[#8B5CF6] text-white px-3 py-1 rounded-full text-xs font-bold">Handicraft & DIY</div>
                    </div>
                </main>
                <BottomNav activeTab="explore" setView={setView} />
            </div>
        );

        const Profile = ({ setView }) => (
            <div className="pb-24">
                <div className="bg-gradient-to-br from-[#A855F7] to-[#EC4899] p-10 pt-16 text-center text-white relative">
                    <div onClick={() => setView('settings')} className="absolute top-8 right-8 cursor-pointer hover:rotate-90 transition-transform">
                        <Icon name="settings" />
                    </div>
                    <div className="w-24 h-24 bg-white/20 border-2 border-white rounded-full mx-auto mb-4 overflow-hidden shadow-xl">
                        <img src="https://randomuser.me/api/portraits/men/32.jpg" className="w-full h-full object-cover" />
                    </div>
                    <h2 className="text-2xl font-bold">test</h2>
                    <p className="opacity-80">21 years • Farum</p>
                    <button onClick={() => window.location.reload()} className="mt-6 bg-white/20 hover:bg-white/30 backdrop-blur-md px-6 py-2 rounded-xl font-bold text-sm transition-all">Log out</button>
                </div>
                <div className="p-6 grid grid-cols-2 gap-3">
                    <div className="aspect-square bg-white border border-slate-100 rounded-2xl shadow-sm overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb773b09?auto=format&fit=crop&q=80&w=500" className="w-full h-full object-cover" />
                    </div>
                    <div className="aspect-square bg-white border border-slate-100 rounded-2xl shadow-sm overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&q=80&w=500" className="w-full h-full object-cover" />
                    </div>
                </div>
                <BottomNav activeTab="profile" setView={setView} />
            </div>
        );

        const Settings = ({ setView }) => (
            <div className="bg-slate-50 min-h-screen">
                <header className="p-6 bg-white flex items-center gap-4 border-b border-slate-100">
                    <div onClick={() => setView('profile')} className="cursor-pointer"><Icon name="arrow-left" /></div>
                    <h1 className="text-xl font-bold">Settings</h1>
                </header>
                <div className="p-6 space-y-4">
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <h3 className="font-bold mb-4">Personal Information</h3>
                        <label className="text-xs font-bold text-slate-400 block mb-1">Name</label>
                        <input className="w-full p-3 bg-slate-50 rounded-xl mb-4 border-none" defaultValue="test" />
                        <label className="text-xs font-bold text-slate-400 block mb-1">Budget</label>
                        <input className="w-full p-3 bg-slate-50 rounded-xl border-none" defaultValue="1000 DKK" />
                    </div>
                    <button onClick={() => setView('profile')} className="w-full bg-gradient-to-r from-[#A855F7] to-[#F97316] text-white py-4 rounded-2xl font-bold shadow-lg">Save Changes</button>
                </div>
            </div>
        );

        // --- MAIN APP COMPONENT ---
        function App() {
            const [view, setView] = useState('onboarding');

            const renderView = () => {
                switch(view) {
                    case 'onboarding': return <Onboarding onComplete={() => setView('explore')} />;
                    case 'explore': return <Explore setView={setView} />;
                    case 'profile': return <Profile setView={setView} />;
                    case 'settings': return <Settings setView={setView} />;
                    case 'community': return <div className="p-10 text-center"><h1 className="text-2xl font-bold">Community Screen</h1><BottomNav activeTab="community" setView={setView} /></div>;
                    case 'messages': return <div className="p-10 text-center"><h1 className="text-2xl font-bold">Messages Screen</h1><BottomNav activeTab="messages" setView={setView} /></div>;
                    case 'invitations': return <div className="p-10 text-center"><h1 className="text-2xl font-bold">Invitations Screen</h1><BottomNav activeTab="invitations" setView={setView} /></div>;
                    default: return <Explore setView={setView} />;
                }
            };

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative overflow-x-hidden">
                    {renderView()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
